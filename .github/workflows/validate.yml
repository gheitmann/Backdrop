name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/validate.py
      - run: python tools/audit_integrations.py
      - run: python tools/check_guide_layout.py
      - run: python tools/check_playback_layout.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Backdrop-MP139-AnyCPU
          path: dist/*
          retention-days: 14
